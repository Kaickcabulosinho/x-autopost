name: autopost
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: autopost
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar nomes
        run: |
          [ -f "x autopost.py" ] && mv "x autopost.py" x_autopost.py || true
          [ -f "x autopost cloud.py" ] && mv "x autopost cloud.py" x_autopost_cloud.py || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python x_autopost_cloud.py
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TZ_NAME: America/Sao_Paulo
          MAX_POSTS_PER_DAY: "20"
          DRY_RUN: "0"
      - name: Salvar fila
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add fila.csv
          git diff --cached --quiet || (git commit -m "atualiza fila" && git pull --rebase && git push)
